[project]
name = "worldcup-2026"
version = "0.1.0"
description = "World Cup 2026 match prediction using Dixon-Coles model + Monte Carlo simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "joblib>=1.3.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts", "dashboard"]
